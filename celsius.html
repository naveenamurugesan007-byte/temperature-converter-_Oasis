<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Temperature Converter</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    transition: all 0.4s ease;
}

/* Light Mode Background */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to right, #a9c3cc, #c7d9df);
}

/* Dark Mode Background */
body.dark {
    background: linear-gradient(to right, #1f1f2e, #2e2e3f);
}

/* Toggle Icon */
.toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 22px;
    cursor: pointer;
}

/* Card */
.container {
    background: #e9e9e9;
    padding: 30px;
    width: 320px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

/* Dark Card */
body.dark .container {
    background: #2f2f3f;
    color: white;
}

/* Heading */
h2 {
    color: #5a6f85;
    margin-bottom: 20px;
}

body.dark h2 {
    color: #ffffff;
}

/* Labels */
.label {
    text-align: left;
    font-size: 14px;
    margin: 10px 0 5px;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    outline: none;
    margin-bottom: 12px;
}

/* Dark Inputs */
body.dark input,
body.dark select {
    background: #444;
    color: white;
    border: 1px solid #666;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    color: white;
    cursor: pointer;
    background: linear-gradient(to right, #66c6b7, #7d90c9);
}

button:hover {
    transform: scale(1.03);
}

/* Result Box */
.result {
    margin-top: 15px;
    padding: 12px;
    background: #d7dade;
    border-radius: 12px;
    font-size: 14px;
    color: #333;
}

/* Dark Result */
body.dark .result {
    background: #444;
    color: #fff;
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleMode()">🌙</div>

<div class="container">
    <h2>🌡 Temperature<br>Converter</h2>

    <div class="label">🌡 Enter Temperature</div>
    <input type="text" id="temp" placeholder="Enter temperature">

    <div class="label">🔄 Select Unit</div>
    <select id="unit">
        <option value="C">🌡 Celsius (°C)</option>
        <option value="F">🔥 Fahrenheit (°F)</option>
        <option value="K">❄ Kelvin (K)</option>
    </select>

    <button onclick="convert()">Convert</button>

    <div class="result" id="result">
        Result will appear here
    </div>
</div>

<script>
function convert() {
    let temp = document.getElementById("temp").value;
    let unit = document.getElementById("unit").value;
    let result = document.getElementById("result");

    if (temp === "" || isNaN(temp)) {
        result.innerHTML = "Please enter a valid number!";
        return;
    }

    temp = parseFloat(temp);

    if (unit === "C") {
        let f = (temp * 9/5) + 32;
        let k = temp + 273.15;
        result.innerHTML = `Converted: ${f.toFixed(2)} °F | ${k.toFixed(2)} K 🔥`;
    } 
    else if (unit === "F") {
        let c = (temp - 32) * 5/9;
        let k = c + 273.15;
        result.innerHTML = `Converted: ${c.toFixed(2)} °C 🌡 | ${k.toFixed(2)} K ❄`;
    } 
    else {
        let c = temp - 273.15;
        let f = (c * 9/5) + 32;
        result.innerHTML = `Converted: ${c.toFixed(2)} °C 🌡 | ${f.toFixed(2)} °F 🔥`;
    }
}

/* Dark Mode Toggle with Animation */
function toggleMode() {
    document.body.classList.toggle("dark");

    let icon = document.querySelector(".toggle");

    if (document.body.classList.contains("dark")) {
        icon.innerHTML = "☀️";
    } else {
        icon.innerHTML = "🌙";
    }
}
</script>

</body>
</html>
